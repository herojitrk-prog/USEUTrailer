<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Trailer Pitch Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky tab bar (Europe, USA, Guide). Lists of companies open as their own view; a company view is master-detail (people left, wide dossier right). */
:root{--bg:#ffffff;--surface:#f4f6f9;--ink:#14202e;--mute:#556376;--line:#dde3ea;--accent:#1f4e8c;--accent-ink:#ffffff;--good:#17794a;--good-bg:#e4f4ec;--warn:#8a5a00;--warn-bg:#fdf1d6;
--navy:#0f2a4a;--blue:#1f5fbf;--blue-bg:#e6effc;--teal:#0b7a75;--teal-bg:#dff3f1;--orange:#b25400;--orange-bg:#fdecd9;--purple:#6a3db3;--purple-bg:#eee7fb;--rose:#b3243d;--rose-bg:#fbe6ea;--head:"Space Grotesk","Segoe UI",sans-serif;--body:"Inter","Segoe UI",system-ui,sans-serif;--th:76px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--surface:#18212d;--ink:#e8edf3;--mute:#9aa7b6;--line:#2a3646;--accent:#7fb0ee;--accent-ink:#0f1620;--good:#6fd0a0;--good-bg:#17352a;--warn:#f0c070;--warn-bg:#3a2d12;--navy:#e8edf3;--blue:#8db8f5;--blue-bg:#16263d;--teal:#5fd1c9;--teal-bg:#12302e;--orange:#f2a65a;--orange-bg:#3a2612;--purple:#b99af0;--purple-bg:#2a1f44;--rose:#f08a9b;--rose-bg:#3d1a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1620;--surface:#18212d;--ink:#e8edf3;--mute:#9aa7b6;--line:#2a3646;--accent:#7fb0ee;--accent-ink:#0f1620;--good:#6fd0a0;--good-bg:#17352a;--warn:#f0c070;--warn-bg:#3a2d12;--navy:#e8edf3;--blue:#8db8f5;--blue-bg:#16263d;--teal:#5fd1c9;--teal-bg:#12302e;--orange:#f2a65a;--orange-bg:#3a2612;--purple:#b99af0;--purple-bg:#2a1f44;--rose:#f08a9b;--rose-bg:#3d1a22;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1480px;margin:0 auto}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:3px solid var(--blue)}
.topin{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
.brand .eb{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);font-weight:600}
.brand b{font:700 24px var(--head);color:var(--navy)}
.tabs{display:flex;gap:8px;flex:1 1 auto;flex-wrap:wrap}
.tab{display:inline-flex;gap:8px;align-items:center;background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 18px;font:600 17px var(--head);text-decoration:none;border:2px solid transparent}
.tab:hover{border-color:var(--blue)}
.sh{display:none}
@media (max-width:560px){.sh{display:inline}}
.tab small{font:600 13px var(--body);background:var(--bg);border-radius:999px;padding:0 9px;color:var(--mute)}
.tab[aria-current="page"]{background:var(--blue);color:var(--bg)}
.tab[aria-current="page"] small{color:var(--blue)}
.theme{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 12px;font:500 14px var(--body);cursor:pointer}
/* generic */
.pagehead{padding-block:20px 6px}
.pagehead h1{font:700 36px/1.15 var(--head);margin:0 0 6px;color:var(--navy)}
.pagehead p{margin:0;color:var(--mute);max-width:80ch;font-size:17px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.kpi{border-radius:10px;padding:10px 16px;min-width:150px}
.kpi b{display:block;font:700 28px/1.1 var(--head)}
.kpi span{font-size:14px}
.kpi.k1{background:var(--blue-bg)}.kpi.k1 b{color:var(--blue)}
.kpi.k2{background:var(--teal-bg)}.kpi.k2 b{color:var(--teal)}
.kpi.k3{background:var(--orange-bg)}.kpi.k3 b{color:var(--orange)}
.kpi.k4{background:var(--purple-bg)}.kpi.k4 b{color:var(--purple)}
.tkey{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--surface);border-left:5px solid var(--blue);border-radius:8px;padding:10px 14px;margin:6px 0;font-size:15px}
.tkey>b{color:var(--blue)}
.tkey .tier{min-width:34px;font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px}
.tools input,.tools select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:16px var(--body)}
.tools input{flex:1 1 260px;min-width:0}
.lnk{border:0;background:none;color:var(--blue);font:500 15px var(--body);cursor:pointer;text-decoration:underline;padding:4px}
.letters{position:sticky;top:calc(var(--th) + env(safe-area-inset-top,0px));z-index:12;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.letters button{flex:none;min-width:36px;border:0;border-radius:8px;background:var(--blue-bg);color:var(--blue);font:700 15px var(--head);padding:5px 8px;cursor:pointer}
.letters button:hover{background:var(--blue);color:var(--bg)}
.res{color:var(--mute);font-size:15px;margin:10px 0}
.lh{font:700 24px var(--head);color:var(--blue);border-bottom:3px solid var(--blue);margin:22px 0 12px;padding:2px 10px;background:linear-gradient(90deg,var(--blue-bg),transparent);border-radius:6px 6px 0 0;scroll-margin-top:calc(var(--th) + 70px)}
/* company cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.co{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-left:7px solid var(--blue);border-radius:12px;padding:16px 18px;color:var(--ink);text-decoration:none;background:var(--bg)}
.co:hover{background:var(--surface);box-shadow:0 3px 14px rgba(0,0,0,.1)}
.co[data-r="Low"]{border-left-color:var(--good)}.co[data-r="Elevated"]{border-left-color:var(--orange)}.co[data-r="High"]{border-left-color:var(--rose)}.co[data-r="Unrated"]{border-left-color:var(--purple)}
.co h3{font:700 21px/1.2 var(--head);color:var(--navy);margin:0;overflow-wrap:anywhere}
.co .m{color:var(--mute);font-size:15px}
.co .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.co .rev{font-weight:600}
.co .mt{font-size:14px;color:var(--ink);background:var(--teal-bg);border-radius:6px;padding:4px 8px}
.co .go{color:var(--blue);font-weight:600;margin-top:auto;padding-top:4px}
.rk{display:inline-block;border-radius:6px;padding:2px 10px;font:600 14px var(--head)}
.rk-Low,.rk-Yes{background:var(--good-bg);color:var(--good)}
.rk-Medium,.rk-Possible{background:var(--blue-bg);color:var(--blue)}
.rk-Likely{background:var(--teal-bg);color:var(--teal)}
.rk-Elevated,.rk-Limited{background:var(--orange-bg);color:var(--orange)}
.rk-High{background:var(--rose-bg);color:var(--rose)}
.rk-Unrated{background:var(--purple-bg);color:var(--purple)}
.tier{display:inline-block;min-width:40px;text-align:center;border-radius:7px;font:700 15px var(--head);padding:3px 8px}
.t-A{background:var(--blue);color:var(--bg)}.t-B{background:var(--teal);color:var(--bg)}.t-C{background:var(--purple-bg);color:var(--purple)}.t-Check{background:var(--orange-bg);color:var(--orange)}
/* sub bar */
.sub{position:sticky;top:calc(var(--th) + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px}
.back{display:inline-flex;align-items:center;gap:8px;flex:none;border:2px solid var(--blue);color:var(--blue);background:var(--bg);border-radius:999px;padding:7px 18px 7px 12px;font:600 17px var(--body);text-decoration:none;cursor:pointer}
.back:hover{background:var(--blue);color:var(--bg)}
.back .ar{font-size:24px;line-height:1;margin-top:-2px}
.sub .ttl{flex:1;min-width:0;font:700 21px var(--head);color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq{display:flex;gap:6px;flex:none}
.sq a{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--blue);font-size:22px}
.sq a:hover{background:var(--blue-bg)}
.chead{padding-block:18px 4px}
.chead h1{font:700 34px/1.15 var(--head);margin:0 0 6px;color:var(--navy);overflow-wrap:anywhere}
.chead .m{color:var(--mute);font-size:16px;display:flex;flex-wrap:wrap;gap:4px 16px}
.chead .r{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blue);color:var(--blue);border-radius:8px;padding:6px 14px;font:600 15px var(--body);text-decoration:none;background:var(--bg)}
.btn:hover{background:var(--blue-bg)}
/* master-detail */
.split{display:grid;grid-template-columns:minmax(290px,350px) minmax(0,1fr);gap:24px;align-items:start;margin-top:16px}
.plist{position:sticky;top:calc(var(--th) + 72px + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--th) - 90px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)}
.plist h2{font:700 13px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:6px 10px}
.pi{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink);border-left:5px solid transparent}
.pi:hover{background:var(--surface)}
.pi[aria-current="page"]{background:var(--blue-bg);border-left-color:var(--blue)}
.pi .n{font:600 16px var(--head);overflow-wrap:anywhere}
.pi .rr{font-size:14px;color:var(--mute);overflow-wrap:anywhere}
.pi .tier{flex:none;margin-top:2px}
.pi.ov .n{color:var(--navy)}
.pane{min-width:0}
/* panels */
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-bottom:14px}
.pn{border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:12px;padding:14px 18px;background:var(--bg);min-width:0}
.pn.full{grid-column:1/-1}
.pn h4{font:700 14px var(--head);letter-spacing:.05em;text-transform:uppercase;margin:0 0 8px;color:var(--blue);display:flex;align-items:center;gap:8px}
.pn h4 .no{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:currentColor;flex:none}
.pn h4 .no i{font-style:normal;color:var(--bg);font:700 14px var(--head)}
.pn p{margin:0 0 6px}.pn p:last-child{margin:0}
.pn ul{margin:0;padding-left:20px}.pn li{margin-bottom:4px}
.pn.blue{border-top-color:var(--blue)}.pn.blue h4{color:var(--blue)}
.pn.teal{border-top-color:var(--teal)}.pn.teal h4{color:var(--teal)}
.pn.orange{border-top-color:var(--orange)}.pn.orange h4{color:var(--orange)}
.pn.purple{border-top-color:var(--purple)}.pn.purple h4{color:var(--purple)}
.pn.green{border-top-color:var(--good)}.pn.green h4{color:var(--good)}
.pn.rose{border-top-color:var(--rose)}.pn.rose h4{color:var(--rose)}
.tag{font-size:13px;color:var(--mute);text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--body)}
.sig{background:var(--good-bg);color:var(--good);border-left:5px solid var(--good);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.sech{font:700 22px var(--head);color:var(--navy);border-left:6px solid var(--teal);padding-left:12px;margin:22px 0 12px}
.cp{border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:6px;font:14px var(--body);padding:2px 10px;cursor:pointer;flex:none}
.cp:hover{border-color:var(--blue);color:var(--blue)}
/* person header */
.ph{border:1px solid var(--line);border-left:7px solid var(--blue);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.ph.c-B{border-left-color:var(--teal)}.ph.c-C{border-left-color:var(--purple)}.ph.c-Check{border-left-color:var(--orange)}
.pht{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pht .who{flex:1 1 260px;min-width:0}
.pht h2{font:700 30px/1.15 var(--head);margin:0;color:var(--navy);overflow-wrap:anywhere}
.pht .role{font-size:18px;color:var(--mute)}
.pht .tm{font-size:15px;color:var(--ink);margin-top:2px}
.pnav{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:15px}
.pnav a{border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-decoration:none;color:var(--blue);font-weight:600}
.pnav a:hover{background:var(--blue-bg)}
.pnav a[aria-disabled="true"]{opacity:.35;pointer-events:none}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flag{font-size:14px;border-radius:6px;padding:3px 10px;background:var(--orange-bg);color:var(--orange)}
.flag.good{background:var(--good-bg);color:var(--good)}
.cts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:14px}
.ci{background:var(--surface);border-radius:10px;padding:10px 14px;min-width:0}
.ci .k{display:block;font:700 12px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:2px}
.ci .v{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ci .v span{overflow-wrap:anywhere;min-width:0}
.svc{display:flex;flex-wrap:wrap;gap:6px}.svc span{background:var(--teal-bg);color:var(--teal);border-radius:6px;padding:3px 10px;font-size:15px}
.cap{border-top-width:5px}
.steps{counter-reset:s}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tbl{overflow-x:auto}
.src{color:var(--mute);font-size:15px;max-width:100ch;margin-top:30px}
.src h2{font:700 14px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
details>summary{cursor:pointer;color:var(--blue);font-weight:600}
.empty{padding:30px 0;color:var(--mute);font-size:18px}
.tothetop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));border:0;background:var(--blue);color:var(--bg);border-radius:999px;padding:10px 18px;font:600 15px var(--body);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);display:none;z-index:25}
@media (max-width:900px){
 .split{grid-template-columns:1fr}
 .plist{position:static;max-height:none}
 .split.pp .plist{display:none}
 .pagehead h1{font-size:28px}.chead h1{font-size:28px}
 .brand b{font-size:20px}
}
@media (max-width:560px){
 .brand{order:1;flex:1}.brand .eb{display:none}.theme{order:2}.tabs{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto}
 .tab{flex:none}.topin{padding-block:8px;gap:8px}
 .lg{display:none}
 .cgrid{grid-template-columns:1fr}
 .tab{padding:8px 12px;font-size:16px}
 .sub .ttl{font-size:17px}.back{padding:6px 14px 6px 10px}
 .sq a{width:38px;height:38px}
 .pg{grid-template-columns:1fr}
}
@media print{.top,.sub,.tothetop,.plist,.tools,.letters{display:none}}
</style>
<style>body{margin:0}</style>
</head>

  var nx=D.accts.slice(i+1).filter(acctOk)[0];if(!nx||letterOf(nx.co)!==l)html+='</div>';
 });
 $("cards").innerHTML=html||'<p class="empty">No companies match these filters.</p>';
